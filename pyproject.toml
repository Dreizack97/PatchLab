[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchlab"
version = "2.0.0"
description = "Etiquetador de escritorio, multiplataforma y de código abierto, para parches de imágenes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dreizack97" }]
keywords = ["image-labeling", "annotation", "dataset", "computer-vision", "pyside6", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Modo "Parches YOLO" (segmentación). Arrastra PyTorch.
yolo = ["ultralytics>=8.1"]
# Herramientas de desarrollo y pruebas.
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Dreizack97/PatchLab"
Repository = "https://github.com/Dreizack97/PatchLab"
Issues = "https://github.com/Dreizack97/PatchLab/issues"
Changelog = "https://github.com/Dreizack97/PatchLab/blob/main/CHANGELOG.md"

[project.gui-scripts]
# Lanzador sin consola (apto para Windows/macOS al hacer doble clic).
patchlab = "patchlab.main:run"

[project.scripts]
# Lanzador desde terminal (útil en Linux y para depuración).
patchlab-cli = "patchlab.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
